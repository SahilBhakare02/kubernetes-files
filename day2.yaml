apiVersion: apps/v1
kind: ReplicaSet
meatadata:
    name: rs
spec:
    selector:
        matchExpressions:
            - {key: app, operator: In, values: ["nginx"]}
    replicas: 5
    template:
        metadata:
            name: my-pod
            labels:
                app: nginx
        spec:
            containers:
                - name: nginx
                  image: nginx:latest
                  ports: 
                    - containerPort: 80


apiVersion: v1
kind: ReplicationController
metadata:
    name: rc
spec:
    replicas: 5
    selector: 
        type: frontend
    template:
        metadata:
            name: my-pod
            labels:
                type: frontend
        spec:
            containers:
                - name: nginx
                  image: nginx:latest
                  ports:
                    - containerPort: 80
---------------------------------------------------------------------------------
#DEPLOYMENT

apiVersion: apps/v1
kind: Deployment
metadata:
    name: my-deploy
    labels:
        app: nginx
spec:
    replicas: 5
    selector:
        matchLabels:
            app: nginx
    template:
        metadata: 
            name: my-pod
            labels: 
                app: nginx
        spec: 
            containers:
                - name: nginx
                  image: nginx:latest
                  ports:
                    - containerPort: 80

    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 1

---------------------------------------------------------------------------------
#STATEFULSET

apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: sts
    labels:
        app: mysql
spec:
    replicas: 5
    selector:
        matchLabels:
            app: mysql
    template:
        metadata:
            name: mysql
            labels:
                app: mysql
        spec:
            containers:
                - name: mysql
                  image: mysql
                  ports:
                    - containerPort: 3306
                  env:
                    - name: MYSQL_ROOT_PASSWORD
                      value: redhat123
---------------------------------------------------------------------------------
