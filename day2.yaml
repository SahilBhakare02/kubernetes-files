apiVersion: apps/v1
kind: Deployment
metadata:
    name: my-deploy
    labels: 
        app: mysql
spec:
    replicas: 1
    selector: 
        matchLabels: 
            app: mysql
    template:
        metadata:
            labels:
                app: mysql
        spec: 
            containers:
                - name: mysql
                  image: mysql
                  ports:
                    - containerPort: 3306
                  env: 
                    - name: MYSQL_USERNAME
                      valueFrom: 
                        configMapKeyRef: 
                            name: my-config
                            key: USERNAME
                    - name: MYSQL_ROOT_PASSWORD
                      valueFrom: 
                        secretKeyRef:
                            name: my-secret
                            key: PAASWORD
